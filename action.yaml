name: Rancher Set Deployment Image Action
description: >
  Set Deployment Image
inputs:
  server:
    description: 'Server Addr'
    required: true
  token:
    description: 'Bearer Token'
    required: true
  cluster:
    description: 'Cluster Name'
    required: false
  namespace:
    description: 'Namespace'
    required: true
  type:
    description: 'Type of Workload'
    required: false
  workload:
    description: 'Workload Name'
    required: true
  container:
    description: 'Deployment Container Index'
    required: false
  image:
    description: 'Target Image'
    required: true
  wait:
    description: 'Waiting workload available'
    required: false
  waittimeout:
    description: 'Wait timeout in seconds'
    required: false
runs:
  using: 'composite'
  steps:
    - run: bash ${{ github.action_path }}/set-image.sh
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CLUSTER: ${{ inputs.cluster }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_WORKLOAD: ${{ inputs.workload }}
        INPUT_CONTAINER: ${{ inputs.container }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_WAITTIMEOUT: ${{ inputs.waittimeout }}