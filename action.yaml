name: Rancher Set Deployment Image Action
description: >
  Update a Kubernetes workload image (Deployment / DaemonSet / StatefulSet / CronJob)
  through the Rancher API.
inputs:
  server:
    description: 'Rancher server URL, format: https://hostname[:port][/path] (IPv6 supported)'
    required: true
  token:
    description: 'Rancher API bearer token'
    required: true
  cluster:
    description: 'Rancher cluster ID or name'
    required: false
    default: 'local'
  namespace:
    description: 'Kubernetes namespace'
    required: true
  type:
    description: 'Workload type: deployments | daemonsets | statefulsets | cronjobs'
    required: false
    default: 'deployments'
  workload:
    description: 'Workload name'
    required: true
  container:
    description: 'Container index in the pod template (0-99)'
    required: false
    default: '0'
  image:
    description: 'Target image'
    required: true
  wait:
    description: 'Wait until the workload is fully available (not supported for cronjobs)'
    required: false
    default: 'false'
  waittimeout:
    description: 'Wait timeout in seconds (1-999999)'
    required: false
    default: '300'
runs:
  using: 'composite'
  steps:
    - run: bash "${{ github.action_path }}/set-image.sh"
      shell: bash
      env:
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CLUSTER: ${{ inputs.cluster }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        INPUT_TYPE: ${{ inputs.type }}
        INPUT_WORKLOAD: ${{ inputs.workload }}
        INPUT_CONTAINER: ${{ inputs.container }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_WAITTIMEOUT: ${{ inputs.waittimeout }}
branding:
  icon: 'refresh-cw'
  color: 'blue'
