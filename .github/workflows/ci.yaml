name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n set-image.sh
          bash -n tests/run.sh
          bash -n tests/mock-curl

      - name: ShellCheck
        run: shellcheck --severity=warning set-image.sh tests/run.sh tests/mock-curl

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Tests
        run: bash tests/run.sh
